<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#F9A825" />
<meta name="description" content="Instructor Dashboard v3.1 — Renal (KUB) Assessment Mastery. Developed by JEMUEL C. MARI, MAN, RN, LPT." />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<title>Instructor Dashboard — Renal (KUB) Mastery v3.1</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
:root{
  --primary:#F9A825;--primary-dark:#C17900;--primary-light:#FFF8E1;--primary-glow:rgba(249,168,37,.35);
  --secondary:#1A237E;--secondary-dark:#0D1550;--secondary-light:#E8EAF6;
  --accent:#E53935;--accent-light:#FFEBEE;
  --success:#43A047;--success-light:#E8F5E9;
  --warning:#FB8C00;--warning-light:#FFF3E0;
  --purple:#6A1B9A;--purple-light:#F3E5F5;
  --dark:#1A1D29;--dark-2:#2A2F3D;
  --light:#FAFAF7;--white:#FFFFFF;--gray:#6E7385;--gray-light:#E8E9ED;--border:#D1D3D9;
  --radius:12px;--radius-sm:8px;
  --shadow-sm:0 1px 3px rgba(26,29,41,.06);
  --shadow:0 4px 16px rgba(26,29,41,.08);
  --shadow-lg:0 12px 32px rgba(26,29,41,.12);
  --shadow-amber:0 8px 24px rgba(249,168,37,.25);
  --font-head:'Inter','Montserrat',sans-serif;
  --font-body:'Inter','Open Sans',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-body);background:var(--light);color:var(--dark);line-height:1.6;font-size:14px;-webkit-font-smoothing:antialiased;background-image:radial-gradient(circle at 10% 15%,rgba(249,168,37,.05) 0%,transparent 45%),radial-gradient(circle at 90% 85%,rgba(26,35,126,.04) 0%,transparent 45%);background-attachment:fixed}
h1,h2,h3,h4{font-family:var(--font-head);font-weight:700;line-height:1.25;letter-spacing:-.02em}
h1{font-size:1.8rem;font-weight:800}h2{font-size:1.4rem}h3{font-size:1.15rem}
p{margin-bottom:.75rem}button{font-family:inherit;cursor:pointer}input,select,textarea{font-family:inherit}
.app-container{display:flex;min-height:100vh}
.sidebar{width:270px;background:linear-gradient(180deg,var(--dark) 0%,var(--dark-2) 45%,var(--secondary-dark) 100%);color:var(--white);padding:1.5rem 1rem;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:100;display:flex;flex-direction:column;box-shadow:4px 0 24px rgba(0,0,0,.1)}
.sidebar::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--primary),var(--primary-dark),var(--secondary))}
.sidebar-header{display:flex;align-items:center;gap:.75rem;padding-bottom:1rem;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:1rem}
.sidebar-header .logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0;box-shadow:var(--shadow-amber)}
.sidebar-header h1{font-size:1rem;color:var(--white)}
.sidebar-header small{display:block;font-size:.68rem;color:rgba(255,255,255,.6);font-weight:400;margin-top:.15rem}
.nav-section{margin-bottom:1.25rem}
.nav-section-title{font-size:.68rem;text-transform:uppercase;letter-spacing:1.2px;color:rgba(255,255,255,.4);margin-bottom:.5rem;padding:0 .65rem;font-weight:700}
.nav-item{display:flex;align-items:center;gap:.7rem;padding:.7rem .85rem;border-radius:10px;color:rgba(255,255,255,.75);cursor:pointer;font-size:.88rem;transition:all .15s;border:none;background:none;width:100%;text-align:left;font-family:var(--font-body);font-weight:500;margin-bottom:.15rem}
.nav-item:hover{background:rgba(255,255,255,.08);color:var(--white);transform:translateX(2px)}
.nav-item.active{background:linear-gradient(90deg,rgba(249,168,37,.5),rgba(26,35,126,.3));color:var(--white);font-weight:600;box-shadow:inset 3px 0 0 var(--primary)}
.nav-item .icon{font-size:1.05rem;width:1.5rem;text-align:center}
.nav-item.logout{color:#FFCDD2}
.nav-item.logout:hover{background:rgba(229,57,53,.3);color:#FFFFFF}
.sidebar-footer{margin-top:auto;padding:1rem .5rem .5rem;border-top:1px solid rgba(255,255,255,.08);font-size:.72rem;line-height:1.55;color:rgba(255,255,255,.55)}
.sidebar-footer .dev-label{font-size:.62rem;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:.3rem}
.sidebar-footer .dev-name{font-weight:700;color:var(--white);font-size:.78rem}
.sidebar-footer .app-version{display:inline-block;margin-top:.5rem;padding:.2rem .55rem;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:var(--white);border-radius:999px;font-size:.65rem;font-weight:700;letter-spacing:.5px}
.main-content{margin-left:270px;flex:1;padding:2rem;max-width:1400px}
.menu-toggle{display:none;position:fixed;top:1rem;left:1rem;z-index:200;background:var(--dark);color:var(--white);border:none;border-radius:12px;width:48px;height:48px;font-size:1.4rem;box-shadow:var(--shadow-lg)}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);transition:transform .3s}
  .sidebar.open{transform:translateX(0)}
  .main-content{margin-left:0;padding:1rem;padding-top:4.5rem}
  .menu-toggle{display:flex;align-items:center;justify-content:center}
}
.card{background:var(--white);border-radius:var(--radius);padding:1.5rem;box-shadow:var(--shadow-sm);margin-bottom:1.25rem;border:1px solid rgba(0,0,0,.04)}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:.5rem}
.card-title{font-size:1.05rem;font-weight:700;color:var(--dark);display:flex;align-items:center;gap:.5rem}
.card-subtitle{font-size:.82rem;color:var(--gray);margin-top:.2rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.65rem 1.25rem;border-radius:10px;border:none;font-family:var(--font-head);font-weight:600;font-size:.88rem;transition:all .2s;text-decoration:none;white-space:nowrap;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:var(--white);box-shadow:var(--shadow-amber)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(249,168,37,.4)}
.btn-secondary{background:var(--secondary);color:var(--white)}
.btn-secondary:hover{background:var(--secondary-dark)}
.btn-outline{background:var(--white);color:var(--primary-dark);border:2px solid var(--primary-light)}
.btn-outline:hover{background:var(--primary-light);border-color:var(--primary)}
.btn-danger{background:var(--accent);color:var(--white)}
.btn-success{background:var(--success);color:var(--white)}
.btn-sm{padding:.4rem .8rem;font-size:.78rem}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.hero{background:linear-gradient(135deg,var(--secondary-dark) 0%,var(--secondary) 50%,var(--primary-dark) 100%);border-radius:24px;padding:2rem;color:var(--white);margin-bottom:1.5rem;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-40%;right:-10%;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(249,168,37,.35) 0%,transparent 65%);pointer-events:none}
.hero-content{position:relative;z-index:1}
.hero-greeting{font-size:.82rem;text-transform:uppercase;letter-spacing:2px;opacity:.85;margin-bottom:.4rem;font-weight:600}
.hero h1{font-size:1.8rem;margin-bottom:.5rem;color:var(--white)}
.hero-subtitle{font-size:.9rem;opacity:.9;max-width:520px}
.hero-stats{display:flex;gap:2rem;flex-wrap:wrap;padding-top:1.15rem;border-top:1px solid rgba(255,255,255,.2);margin-top:1.15rem}
.hero-stat .stat-value{font-family:var(--font-head);font-weight:800;font-size:1.5rem;line-height:1;color:var(--primary)}
.hero-stat .stat-label{font-size:.7rem;opacity:.85;margin-top:.3rem;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.dashboard-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:1.25rem}
.stat-card{background:var(--white);border-radius:var(--radius);padding:1.25rem;box-shadow:var(--shadow-sm);text-align:center;border:1px solid rgba(0,0,0,.04);transition:all .25s}
.stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.stat-card .stat-value{font-size:2rem;font-weight:800;color:var(--primary-dark);font-family:var(--font-head);line-height:1}
.stat-card .stat-label{font-size:.75rem;color:var(--gray);margin-top:.4rem;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.stat-card.alert .stat-value{color:var(--accent)}
.stat-card.success .stat-value{color:var(--success)}
.stat-card.warning .stat-value{color:var(--warning)}
.stat-card.purple .stat-value{color:var(--purple)}
.table-wrap{overflow-x:auto;margin:1rem 0;border-radius:12px;box-shadow:var(--shadow-sm)}
table{width:100%;border-collapse:collapse;font-size:.88rem;background:var(--white)}
th{background:linear-gradient(135deg,var(--secondary),var(--secondary-dark));color:var(--white);padding:.75rem;text-align:left;font-family:var(--font-head);font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
td{padding:.75rem;border-bottom:1px solid var(--gray-light);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:nth-child(even){background:#FAFBFC}
tr:hover{background:var(--primary-light)}
tr.alert-row{background:#FFF8E1!important}
.pill{display:inline-block;padding:.2rem .65rem;border-radius:999px;font-size:.72rem;font-weight:700;font-family:var(--font-head)}
.pill-success{background:var(--success-light);color:#1B5E20}
.pill-warning{background:var(--warning-light);color:#E65100}
.pill-danger{background:var(--accent-light);color:#B71C1C}
.pill-info{background:var(--secondary-light);color:var(--secondary-dark)}
.pill-gray{background:var(--gray-light);color:var(--gray)}
.pill-purple{background:var(--purple-light);color:var(--purple)}
.pill-amber{background:var(--primary-light);color:var(--primary-dark)}
.progress-bar{height:10px;background:var(--gray-light);border-radius:5px;overflow:hidden;min-width:80px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--success),var(--primary));border-radius:5px;transition:width .5s}
.progress-fill.warn{background:linear-gradient(90deg,var(--warning),var(--accent))}
.progress-fill.danger{background:var(--accent)}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-weight:600;margin-bottom:.35rem;font-size:.82rem;font-family:var(--font-head)}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:.65rem .85rem;border:2px solid var(--gray-light);border-radius:10px;font-size:.9rem;background:var(--white);color:var(--dark);transition:all .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-glow)}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem}
.modal-overlay{position:fixed;inset:0;background:rgba(26,29,41,.65);display:none;align-items:center;justify-content:center;z-index:1000;padding:1rem;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex;animation:fadeIn .2s ease}
.modal{background:var(--white);border-radius:16px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto;padding:0;box-shadow:0 32px 80px rgba(0,0,0,.4);animation:scaleIn .3s ease}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:1.15rem 1.4rem;border-bottom:1px solid var(--gray-light);position:sticky;top:0;background:var(--white);z-index:3;border-radius:16px 16px 0 0}
.modal-header h2{font-size:1.05rem;color:var(--dark)}
.modal-close{background:var(--gray-light);border:none;font-size:1.1rem;cursor:pointer;color:var(--gray);line-height:1;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--accent-light);color:var(--accent)}
.modal-body{padding:1.4rem}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translate(-50%,200%);background:var(--dark);color:var(--white);padding:1rem 1.5rem;border-radius:14px;box-shadow:var(--shadow-lg);z-index:9999;transition:transform .35s ease;max-width:400px;font-size:.88rem;font-weight:500}
.toast.show{transform:translate(-50%,0)}
.toast.success{background:var(--success)}
.toast.error{background:var(--accent)}
.toast.warning{background:var(--warning)}
.callout{padding:1rem 1.25rem;border-radius:12px;margin:1rem 0;border-left:4px solid;font-size:.88rem;line-height:1.65}
.callout-warning{background:var(--warning-light);border-color:var(--warning)}
.callout-danger{background:var(--accent-light);border-color:var(--accent)}
.callout-success{background:var(--success-light);border-color:var(--success)}
.callout-info{background:var(--secondary-light);border-color:var(--secondary)}
.callout strong{font-family:var(--font-head);font-weight:700}
.search-box{position:relative;margin-bottom:1rem}
.search-box input{padding-left:2.75rem;width:100%;padding:.75rem 1rem .75rem 2.75rem;border:2px solid var(--gray-light);border-radius:12px;font-size:.9rem}
.search-box input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-glow)}
.search-box::before{content:'🔍';position:absolute;left:1rem;top:50%;transform:translateY(-50%);font-size:1rem;opacity:.5}
.bar-chart{display:flex;align-items:flex-end;gap:.5rem;height:200px;padding:1rem 0;border-bottom:2px solid var(--gray-light)}
.bar-chart .bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar-chart .bar{width:100%;max-width:70px;background:linear-gradient(180deg,var(--primary),var(--primary-dark));border-radius:8px 8px 0 0;transition:height .6s cubic-bezier(.4,0,.2,1);min-height:4px;box-shadow:0 -4px 12px rgba(249,168,37,.2)}
.bar-chart .bar-label{font-size:.7rem;margin-top:.5rem;text-align:center;color:var(--gray);font-weight:600;white-space:nowrap}
.bar-chart .bar-value{font-size:.75rem;font-weight:800;color:var(--primary-dark);margin-bottom:.35rem;font-family:var(--font-head)}
.developer-card{background:linear-gradient(135deg,var(--primary-light),var(--secondary-light));border:2px solid var(--primary);border-radius:14px;padding:1.5rem;text-align:center;margin-bottom:1.5rem}
.developer-card .dev-label{font-size:.68rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--gray);font-weight:700;margin-bottom:.4rem}
.developer-card .dev-name{font-family:var(--font-head);font-weight:700;font-size:1.1rem;color:var(--primary-dark);margin-bottom:.4rem}
.developer-card .dev-info{font-size:.82rem;color:var(--dark);line-height:1.7}
.drop-zone{border:3px dashed var(--primary);border-radius:14px;padding:2rem;text-align:center;background:var(--primary-light);transition:all .2s;cursor:pointer;margin:1rem 0}
.drop-zone:hover,.drop-zone.dragover{background:#FFECB3;border-color:var(--primary-dark);transform:scale(1.01)}
.drop-zone .drop-icon{font-size:3rem;margin-bottom:.5rem}
.drop-zone .drop-title{font-family:var(--font-head);font-weight:700;font-size:1rem;color:var(--primary-dark);margin-bottom:.25rem}
.drop-zone .drop-hint{font-size:.82rem;color:var(--gray)}
.qr-scanner-container{position:relative;width:100%;max-width:480px;margin:1rem auto;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:1}
#qrVideo{width:100%;height:100%;object-fit:cover;display:block}
.qr-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.qr-frame{width:70%;height:70%;max-width:320px;max-height:320px;border:3px solid #FFFFFF;border-radius:18px;position:relative;box-shadow:0 0 0 4000px rgba(0,0,0,.45)}
.qr-frame::before,.qr-frame::after{content:'';position:absolute;width:32px;height:32px;border-color:var(--primary);border-style:solid}
.qr-frame::before{top:-3px;left:-3px;border-width:4px 0 0 4px;border-radius:18px 0 0 0}
.qr-frame::after{bottom:-3px;right:-3px;border-width:0 4px 4px 0;border-radius:0 0 18px 0}
.qr-scan-line{position:absolute;left:0;right:0;top:50%;height:3px;background:linear-gradient(90deg,transparent,var(--primary),transparent);animation:scanline 2s linear infinite}
@keyframes scanline{0%{top:10%}50%{top:90%}100%{top:10%}}
.qr-status{text-align:center;padding:.75rem;font-size:.88rem;color:var(--gray);min-height:40px}
.qr-status.active{color:var(--success);font-weight:600}
.qr-status.error{color:var(--accent);font-weight:600}
.retake-code-box{background:var(--primary-light);padding:1.25rem;border-radius:14px;border:3px dashed var(--primary);margin:1rem 0;text-align:center}
.retake-code-box .code-label{font-size:.72rem;color:var(--gray);text-transform:uppercase;letter-spacing:2px;margin-bottom:.5rem;font-weight:700}
.retake-code-box .code-value{font-family:'Courier New',monospace;font-size:2rem;font-weight:800;color:var(--primary-dark);letter-spacing:6px}
.feedback-card{background:var(--primary-light);border-left:4px solid var(--primary);padding:1rem;border-radius:10px;margin-bottom:.85rem}
.feedback-card .feedback-meta{font-size:.78rem;color:var(--gray);font-weight:600}
.feedback-card .feedback-body{margin-top:.4rem;font-size:.9rem}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--gray)}
.empty-state .icon{font-size:3.5rem;margin-bottom:.5rem}
.loader{display:flex;align-items:center;justify-content:center;padding:3rem;flex-direction:column;gap:1rem;color:var(--gray)}
.spinner{width:44px;height:44px;border:4px solid var(--gray-light);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.hidden{display:none!important}
.text-center{text-align:center}.text-right{text-align:right}
.mt-1{margin-top:.5rem}.mt-2{margin-top:1rem}.mb-1{margin-bottom:.5rem}.mb-2{margin-bottom:1rem}
.flex{display:flex}.flex-wrap{flex-wrap:wrap}.gap-1{gap:.5rem}.gap-2{gap:1rem}.items-center{align-items:center}.justify-between{justify-content:space-between}
code{background:var(--primary-light);padding:.15rem .45rem;border-radius:6px;font-family:'Courier New',monospace;font-size:.85em;color:var(--primary-dark);font-weight:700}
.paste-area{width:100%;min-height:160px;padding:.85rem;border:2px solid var(--gray-light);border-radius:10px;font-family:'Courier New',monospace;font-size:.72rem;resize:vertical;background:var(--light)}
.paste-area:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-glow)}
.preview-box{background:var(--success-light);border:2px solid var(--success);border-radius:12px;padding:1rem;margin-top:1rem}
.preview-box .preview-title{font-family:var(--font-head);font-weight:700;color:#1B5E20;margin-bottom:.5rem}
</style>
</head>
<body>

<div class="app-container">
  <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">👨‍🏫</div>
      <div><h1>Instructor Dashboard</h1><small>Renal (KUB) Mastery v3.1</small></div>
    </div>
    <nav>
      <div class="nav-section">
        <div class="nav-section-title">Overview</div>
        <button class="nav-item active" data-view="dashboard" onclick="showView('dashboard')"><span class="icon">📊</span> Dashboard</button>
        <button class="nav-item" data-view="roster" onclick="showView('roster')"><span class="icon">👥</span> Student Roster</button>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">Analytics</div>
        <button class="nav-item" data-view="analytics" onclick="showView('analytics')"><span class="icon">📈</span> Performance</button>
        <button class="nav-item" data-view="alerts" onclick="showView('alerts')"><span class="icon">🚨</span> Alerts</button>
        <button class="nav-item" data-view="feedback" onclick="showView('feedback')"><span class="icon">💬</span> Feedback</button>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">Tools</div>
        <button class="nav-item" data-view="qrscan" onclick="showView('qrscan')"><span class="icon">📷</span> QR Scanner</button>
        <button class="nav-item" data-view="retakes" onclick="showView('retakes')"><span class="icon">🔑</span> Retake Codes</button>
        <button class="nav-item" data-view="import" onclick="showView('import')"><span class="icon">📥</span> Import Data</button>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">Links</div>
        <button class="nav-item" onclick="window.location.href='gradebook.html'"><span class="icon">📋</span> Open Gradebook</button>
        <button class="nav-item" onclick="window.location.href='index.html'"><span class="icon">🎓</span> Student App</button>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="dev-label">Developed by</div>
      <div class="dev-name">JEMUEL C. MARI, MAN, RN, LPT</div>
      <div>Clinical Instructor · TSU</div>
      <div class="app-version">v3.1.0</div>
    </div>
  </aside>

  <main class="main-content" id="mainContent">
    <div class="loader"><div class="spinner"></div><div>Loading dashboard…</div></div>
  </main>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Modal</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   RENAL (KUB) INSTRUCTOR DASHBOARD — v3.1.0
   ============================================================ */
var BACKEND_URL = 'https://script.google.com/macros/s/AKfycbyM9Ysp09afI-UPaTPA-OnIpzJ7h8vSR0XhI2z7mptx_FLcasGxPBXGThLBqqASjj-D/exec';
var UNIT_KEYS = ['unit1','unit2','unit3','unit4','unit5','unit6','unit7','unit8'];
var UNIT_NAMES = ['Foundation','Subjective','Inspection','Auscultation','Palpation','Percussion','Diseases','Interventions'];
var GAME_KEYS = ['blitz','tree','urine','redflag','matrix'];

var DASH = {
  students: [],
  retakes: [],
  feedback: [],
  lastSync: null,
  currentView: 'dashboard',
  searchQuery: ''
};

/* ---------- INIT ---------- */
function init() {
  loadLocal();
  showView('dashboard');
  syncFromBackend(true);
}

function loadLocal() {
  try {
    var s = localStorage.getItem('renalMastery_instructor_v3');
    if (s) {
      var d = JSON.parse(s);
      DASH.students = d.students || [];
      DASH.retakes = d.retakes || [];
      DASH.feedback = d.feedback || [];
      DASH.lastSync = d.lastSync || null;
    }
  } catch (e) { console.warn(e); }
}
function saveLocal() {
  try { localStorage.setItem('renalMastery_instructor_v3', JSON.stringify({
    students: DASH.students, retakes: DASH.retakes, feedback: DASH.feedback, lastSync: DASH.lastSync
  })); } catch (e) {}
}

async function syncFromBackend(silent) {
  if (!silent) toast('Syncing from Google Sheets…', '');
  try {
    var res = await fetch(BACKEND_URL + '?action=listAll');
    var data = await res.json();
    if (!data.success) throw new Error(data.error || 'Sync failed');
    var added = 0, updated = 0;
    (data.records || []).forEach(function(rec) {
      var existing = DASH.students.find(function(s) {
        var m1 = rec.studentNo && s.studentNo && String(s.studentNo).trim() === String(rec.studentNo).trim();
        var m2 = rec.email && s.email && String(s.email).toLowerCase() === String(rec.email).toLowerCase();
        return m1 || m2;
      });
      var payload = null;
      try { payload = JSON.parse(rec.dataJson); } catch (e) {}
      var student = {
        timestamp: rec.timestamp || new Date().toISOString(),
        code: rec.code || '',
        name: rec.fullName || '',
        studentNo: rec.studentNo || '',
        section: rec.section || '',
        group: rec.group || '',
        email: rec.email || '',
        schoolYear: rec.schoolYear || '',
        semester: rec.semester || '',
        unitsCompleted: rec.unitsCompleted || '0%',
        unitAvg: rec.unitAvg || '0%',
        examScore: rec.examScore || '',
        examTotal: rec.examTotal || '',
        examPercentage: rec.examPercentage || '',
        examPassed: rec.examPassed || '',
        integrityFlags: rec.integrityFlags || 0,
        appVersion: rec.appVersion || '3.1',
        progress: (payload && payload.progress) || {},
        quizAttempts: (payload && payload.quizAttempts) || {},
        games: (payload && payload.games) || {},
        exam: (payload && payload.exam) || null
      };
      if (existing) { Object.assign(existing, student); updated++; }
      else { DASH.students.push(student); added++; }
    });
    DASH.lastSync = new Date().toISOString();
    saveLocal();
    if (DASH.currentView === 'dashboard') renderDashboard();
    else showView(DASH.currentView);
    if (!silent) toast('✅ Sync complete — ' + added + ' added, ' + updated + ' updated', 'success');
  } catch (err) {
    console.error(err);
    if (!silent) toast('Sync failed: ' + err.message, 'error');
    if (DASH.currentView === 'dashboard') renderDashboard();
  }
}

/* ---------- HELPERS ---------- */
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}
function toast(msg, type) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (type || '');
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove('show'); }, 3500);
}
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('show'); }

function getProgressPct(s) {
  if (typeof s.unitsCompleted === 'string') return parseInt(s.unitsCompleted, 10) || 0;
  var done = UNIT_KEYS.filter(function(u){ return s.progress && s.progress[u] && s.progress[u].completed; }).length;
  return Math.round((done / 8) * 100);
}
function getQuizAvg(s) {
  var scores = [];
  Object.keys(s.quizAttempts || {}).forEach(function(k){
    var arr = s.quizAttempts[k];
    if (arr && arr.length) scores.push(Math.max.apply(null, arr));
  });
  if (!scores.length) return null;
  return Math.round(scores.reduce(function(a,b){return a+b;},0) / scores.length);
}
function hasExam(s) {
  return s.examScore !== '' && s.examScore !== null && s.examScore !== undefined;
}
function getExamPct(s) {
  if (s.examPercentage !== '' && s.examPercentage !== null && s.examPercentage !== undefined) return parseInt(s.examPercentage, 10) || 0;
  if (s.exam && s.exam.percentage) return s.exam.percentage;
  return null;
}
function isExamPassed(s) {
  return s.examPassed === 'PASSED' || s.examPassed === true || (s.exam && s.exam.passed);
}
function isAtRisk(s) {
  var pct = getProgressPct(s);
  var exam = getExamPct(s);
  return (pct < 50) || (exam !== null && exam < 50) || (s.integrityFlags > 0);
}
function isMastery(s) {
  var exam = getExamPct(s);
  var quiz = getQuizAvg(s);
  var pct = getProgressPct(s);
  return pct >= 100 && exam !== null && exam >= 90 && quiz !== null && quiz >= 90;
}

/* ---------- VIEW ROUTER ---------- */
function showView(view) {
  DASH.currentView = view;
  document.querySelectorAll('.nav-item').forEach(function(n){
    n.classList.toggle('active', n.dataset.view === view);
  });
  var main = document.getElementById('mainContent');
  switch (view) {
    case 'dashboard': renderDashboard(); break;
    case 'roster':    renderRoster(); break;
    case 'analytics': renderAnalytics(); break;
    case 'alerts':    renderAlerts(); break;
    case 'feedback':  renderFeedback(); break;
    case 'qrscan':    renderQRScanner(); break;
    case 'retakes':   renderRetakes(); break;
    case 'import':    renderImport(); break;
  }
  window.scrollTo(0, 0);
  if (document.getElementById('sidebar').classList.contains('open')) toggleSidebar();
}

/* ---------- DASHBOARD ---------- */
function renderDashboard() {
  var n = DASH.students.length;
  var passed = DASH.students.filter(isExamPassed).length;
  var atRisk = DASH.students.filter(isAtRisk).length;
  var mastered = DASH.students.filter(isMastery).length;
  var avgProgress = n ? Math.round(DASH.students.reduce(function(a,s){ return a + getProgressPct(s); }, 0) / n) : 0;
  var examPcts = DASH.students.map(getExamPct).filter(function(v){ return v !== null; });
  var avgExam = examPcts.length ? Math.round(examPcts.reduce(function(a,b){return a+b;},0) / examPcts.length) : null;

  document.getElementById('mainContent').innerHTML =
    '<div class="hero"><div class="hero-content">' +
    '<div class="hero-greeting">Instructor Dashboard</div>' +
    '<h1>Welcome back, Sir Jemuel 👋</h1>' +
    '<p class="hero-subtitle">Monitor your students\' renal mastery progress in real time. Last sync: ' + (DASH.lastSync ? new Date(DASH.lastSync).toLocaleString() : 'Never — click Sync') + '</p>' +
    '<div class="hero-stats">' +
      '<div class="hero-stat"><div class="stat-value">' + n + '</div><div class="stat-label">Total Students</div></div>' +
      '<div class="hero-stat"><div class="stat-value">' + passed + '</div><div class="stat-label">Exam Passed</div></div>' +
      '<div class="hero-stat"><div class="stat-value">' + mastered + '</div><div class="stat-label">Mastered</div></div>' +
      '<div class="hero-stat"><div class="stat-value">' + atRisk + '</div><div class="stat-label">At Risk</div></div>' +
    '</div></div></div>' +

    '<div class="dashboard-grid">' +
      '<div class="stat-card"><div class="stat-value">' + avgProgress + '%</div><div class="stat-label">Avg Progress</div></div>' +
      '<div class="stat-card ' + (avgExam !== null && avgExam >= 75 ? 'success' : 'warning') + '"><div class="stat-value">' + (avgExam !== null ? avgExam + '%' : '—') + '</div><div class="stat-label">Avg Exam</div></div>' +
      '<div class="stat-card purple"><div class="stat-value">' + DASH.retakes.length + '</div><div class="stat-label">Retake Codes</div></div>' +
      '<div class="stat-card ' + (DASH.feedback.length ? 'warning' : '') + '"><div class="stat-value">' + DASH.feedback.length + '</div><div class="stat-label">Feedback</div></div>' +
    '</div>' +

    '<div class="card"><div class="card-header">' +
      '<div><div class="card-title">🚀 Quick Actions</div><div class="card-subtitle">Common tasks</div></div>' +
      '<button class="btn btn-primary btn-sm" onclick="syncFromBackend()">🔄 Sync Now</button>' +
    '</div>' +
    '<div class="flex gap-1 flex-wrap">' +
      '<button class="btn btn-outline" onclick="showView(\'qrscan\')">📷 Scan QR Code</button>' +
      '<button class="btn btn-outline" onclick="showView(\'retakes\')">🔑 Issue Retake</button>' +
      '<button class="btn btn-outline" onclick="showView(\'roster\')">👥 View Roster</button>' +
      '<button class="btn btn-outline" onclick="window.location.href=\'gradebook.html\'">📋 Open Gradebook</button>' +
    '</div></div>' +

    renderRecentSubmissions();
}

function renderRecentSubmissions() {
  var recent = DASH.students.slice().sort(function(a,b){
    return new Date(b.timestamp || 0) - new Date(a.timestamp || 0);
  }).slice(0, 5);
  if (!recent.length) return '<div class="card"><div class="card-header"><div class="card-title">📥 Recent Submissions</div></div><div class="empty-state"><div class="icon">📭</div><p>No submissions yet. Students will appear here after they submit their progress.</p></div></div>';
  return '<div class="card"><div class="card-header"><div class="card-title">📥 Recent Submissions</div><button class="btn btn-sm btn-outline" onclick="showView(\'roster\')">View All →</button></div>' +
    '<div class="table-wrap"><table><thead><tr><th>Student</th><th>Section</th><th>Progress</th><th>Exam</th><th>Submitted</th></tr></thead><tbody>' +
    recent.map(function(s){
      var pct = getProgressPct(s);
      var exam = getExamPct(s);
      return '<tr><td><strong>' + escapeHtml(s.name) + '</strong><br><small style="color:var(--gray);">' + escapeHtml(s.studentNo) + '</small></td>' +
        '<td>' + escapeHtml(s.section || '—') + '</td>' +
        '<td><div class="progress-bar" style="width:100px;"><div class="progress-fill ' + (pct < 50 ? 'danger' : pct < 80 ? 'warn' : '') + '" style="width:' + pct + '%"></div></div><small>' + pct + '%</small></td>' +
        '<td>' + (exam !== null ? (isExamPassed(s) ? '<span class="pill pill-success">' + exam + '%</span>' : '<span class="pill pill-danger">' + exam + '%</span>') : '<span class="pill pill-gray">—</span>') + '</td>' +
        '<td><small>' + (s.timestamp ? new Date(s.timestamp).toLocaleString() : '—') + '</small></td></tr>';
    }).join('') +
    '</tbody></table></div></div>';
}

/* ---------- ROSTER ---------- */
function renderRoster() {
  var students = DASH.students.slice();
  if (DASH.searchQuery) {
    var q = DASH.searchQuery.toLowerCase();
    students = students.filter(function(s){
      return (s.name || '').toLowerCase().indexOf(q) >= 0 ||
             (s.studentNo || '').toLowerCase().indexOf(q) >= 0 ||
             (s.section || '').toLowerCase().indexOf(q) >= 0;
    });
  }
  students.sort(function(a,b){ return (a.name || '').localeCompare(b.name || ''); });

  var html = '<div class="card"><div class="card-header">' +
    '<div><div class="card-title">👥 Student Roster</div><div class="card-subtitle">' + students.length + ' of ' + DASH.students.length + ' students</div></div>' +
    '<button class="btn btn-sm btn-outline" onclick="exportRosterCSV()">📤 Export CSV</button>' +
    '</div>' +
    '<div class="search-box"><input type="text" placeholder="Search by name, student no., or section…" value="' + escapeHtml(DASH.searchQuery) + '" oninput="DASH.searchQuery=this.value;renderRoster()"></div>';

  if (!students.length) {
    html += '<div class="empty-state"><div class="icon">📭</div><p>No students match your search.</p></div></div>';
    document.getElementById('mainContent').innerHTML = html;
    return;
  }

  html += '<div class="table-wrap"><table><thead><tr>' +
    '<th>Student</th><th>Section</th><th>Group</th><th>Progress</th><th>Quiz Avg</th><th>Exam</th><th>Flags</th><th>Actions</th>' +
    '</tr></thead><tbody>' +
    students.map(function(s){
      var pct = getProgressPct(s);
      var quiz = getQuizAvg(s);
      var exam = getExamPct(s);
      var risk = isAtRisk(s);
      return '<tr class="' + (risk ? 'alert-row' : '') + '">' +
        '<td><strong>' + escapeHtml(s.name) + '</strong><br><small style="color:var(--gray);">' + escapeHtml(s.studentNo) + '</small></td>' +
        '<td>' + escapeHtml(s.section || '—') + '</td>' +
        '<td>' + escapeHtml(s.group || '—') + '</td>' +
        '<td><div class="progress-bar" style="width:100px;"><div class="progress-fill ' + (pct < 50 ? 'danger' : pct < 80 ? 'warn' : '') + '" style="width:' + pct + '%"></div></div><small style="font-weight:700;">' + pct + '%</small></td>' +
        '<td>' + (quiz !== null ? '<span class="pill ' + (quiz >= 90 ? 'pill-success' : quiz >= 75 ? 'pill-amber' : 'pill-warning') + '">' + quiz + '%</span>' : '<span class="pill pill-gray">—</span>') + '</td>' +
        '<td>' + (exam !== null ? (isExamPassed(s) ? '<span class="pill pill-success">✅ ' + exam + '%</span>' : '<span class="pill pill-danger">❌ ' + exam + '%</span>') : '<span class="pill pill-gray">Not taken</span>') + '</td>' +
        '<td>' + (s.integrityFlags > 0 ? '<span class="pill pill-danger">⚠️ ' + s.integrityFlags + '</span>' : '<span class="pill pill-success">Clear</span>') + '</td>' +
        '<td><button class="btn btn-sm btn-outline" onclick="viewStudent(\'' + escapeHtml(s.studentNo || s.email) + '\')">👁️ View</button></td>' +
        '</tr>';
    }).join('') +
    '</tbody></table></div></div>';

  document.getElementById('mainContent').innerHTML = html;
}

function viewStudent(id) {
  var s = DASH.students.find(function(x){ return x.studentNo === id || x.email === id; });
  if (!s) return;
  var unitScores = UNIT_KEYS.map(function(u, i){
    var arr = (s.quizAttempts && s.quizAttempts[u]) || [];
    var best = arr.length ? Math.max.apply(null, arr) : null;
    return '<tr><td>Unit ' + (i+1) + ' — ' + UNIT_NAMES[i] + '</td><td>' + (best !== null ? best + '%' : '—') + '</td></tr>';
  }).join('');
  document.getElementById('modalTitle').textContent = '👤 ' + s.name;
  document.getElementById('modalBody').innerHTML =
    '<div class="dashboard-grid">' +
      '<div class="stat-card"><div class="stat-value">' + getProgressPct(s) + '%</div><div class="stat-label">Progress</div></div>' +
      '<div class="stat-card ' + (getQuizAvg(s) >= 75 ? 'success' : 'warning') + '"><div class="stat-value">' + (getQuizAvg(s) || '—') + (getQuizAvg(s) !== null ? '%' : '') + '</div><div class="stat-label">Quiz Avg</div></div>' +
      '<div class="stat-card purple"><div class="stat-value">' + (getExamPct(s) !== null ? getExamPct(s) + '%' : '—') + '</div><div class="stat-label">Exam</div></div>' +
      '<div class="stat-card ' + (s.integrityFlags ? 'alert' : 'success') + '"><div class="stat-value">' + (s.integrityFlags || 0) + '</div><div class="stat-label">Flags</div></div>' +
    '</div>' +
    '<p><strong>Student No.:</strong> ' + escapeHtml(s.studentNo) + '<br>' +
    '<strong>Section:</strong> ' + escapeHtml(s.section) + '<br>' +
    '<strong>Group:</strong> ' + escapeHtml(s.group) + '<br>' +
    '<strong>Email:</strong> ' + escapeHtml(s.email) + '<br>' +
    '<strong>School Year:</strong> ' + escapeHtml(s.schoolYear) + ' — ' + escapeHtml(s.semester) + '<br>' +
    '<strong>Submission Code:</strong> <code>' + escapeHtml(s.code) + '</code></p>' +
    '<h3>Unit Quiz Scores</h3>' +
    '<div class="table-wrap"><table><thead><tr><th>Unit</th><th>Best Score</th></tr></thead><tbody>' + unitScores + '</tbody></table></div>' +
    '<div class="flex gap-1 mt-2">' +
      '<button class="btn btn-primary btn-block" onclick="issueRetakeFor(\'' + escapeHtml(s.studentNo) + '\',\'' + escapeHtml(s.email) + '\')">🔑 Issue Retake Code</button>' +
    '</div>';
  document.getElementById('modalOverlay').classList.add('show');
}

/* ---------- ANALYTICS ---------- */
function renderAnalytics() {
  var unitAvgs = UNIT_KEYS.map(function(u){
    var scores = DASH.students.map(function(s){
      var arr = (s.quizAttempts && s.quizAttempts[u]) || [];
      return arr.length ? Math.max.apply(null, arr) : null;
    }).filter(function(v){ return v !== null; });
    return scores.length ? Math.round(scores.reduce(function(a,b){return a+b;},0) / scores.length) : 0;
  });

  var html = '<div class="card"><div class="card-header"><div><div class="card-title">📈 Unit Performance</div><div class="card-subtitle">Average quiz score per learning unit</div></div></div>' +
    '<div class="bar-chart">' +
    unitAvgs.map(function(v, i){
      return '<div class="bar-wrap"><div class="bar-value">' + v + '%</div><div class="bar" style="height:' + v + '%"></div><div class="bar-label">U' + (i+1) + '<br><small>' + UNIT_NAMES[i].slice(0,8) + '</small></div></div>';
    }).join('') +
    '</div></div>' +

    '<div class="card"><div class="card-header"><div class="card-title">🎯 Exam Distribution</div></div>' +
    renderExamDistribution() +
    '</div>' +

    '<div class="card"><div class="card-header"><div class="card-title">🎮 Game Engagement</div></div>' +
    renderGameEngagement() +
    '</div>';

  document.getElementById('mainContent').innerHTML = html;
}

function renderExamDistribution() {
  var buckets = [
    { label: 'Not taken', range: [null, null], count: 0, color: 'gray' },
    { label: 'Failed (<50%)', range: [0, 49], count: 0, color: 'danger' },
    { label: 'Passed (50–74%)', range: [50, 74], count: 0, color: 'warning' },
    { label: 'Good (75–89%)', range: [75, 89], count: 0, color: 'amber' },
    { label: 'Excellent (≥90%)', range: [90, 100], count: 0, color: 'success' }
  ];
  DASH.students.forEach(function(s){
    var p = getExamPct(s);
    if (p === null) buckets[0].count++;
    else if (p < 50) buckets[1].count++;
    else if (p < 75) buckets[2].count++;
    else if (p < 90) buckets[3].count++;
    else buckets[4].count++;
  });
  return '<div class="dashboard-grid">' + buckets.map(function(b){
    return '<div class="stat-card ' + (b.color === 'gray' ? '' : b.color) + '"><div class="stat-value">' + b.count + '</div><div class="stat-label">' + b.label + '</div></div>';
  }).join('') + '</div>';
}

function renderGameEngagement() {
  var rows = GAME_KEYS.map(function(g){
    var played = DASH.students.filter(function(s){ return s.games && s.games[g] && s.games[g].length; }).length;
    var pct = DASH.students.length ? Math.round((played / DASH.students.length) * 100) : 0;
    return { game: g, played: played, pct: pct };
  });
  return '<div class="table-wrap"><table><thead><tr><th>Game</th><th>Students Played</th><th>%</th></tr></thead><tbody>' +
    rows.map(function(r){
      return '<tr><td><strong>' + r.game.charAt(0).toUpperCase() + r.game.slice(1) + '</strong></td><td>' + r.played + ' / ' + DASH.students.length + '</td><td><div class="progress-bar" style="width:120px;"><div class="progress-fill" style="width:' + r.pct + '%"></div></div></td></tr>';
    }).join('') +
    '</tbody></table></div>';
}

/* ---------- ALERTS ---------- */
function renderAlerts() {
  var flagged = DASH.students.filter(isAtRisk);
  var html = '<div class="card"><div class="card-header"><div><div class="card-title">🚨 At-Risk Students</div><div class="card-subtitle">Students needing intervention</div></div></div>';
  if (!flagged.length) {
    html += '<div class="empty-state"><div class="icon">✅</div><h3>All students on track</h3><p style="color:var(--gray);">No alerts at this time.</p></div>';
  } else {
    html += '<div class="table-wrap"><table><thead><tr><th>Student</th><th>Issue</th><th>Action</th></tr></thead><tbody>' +
      flagged.map(function(s){
        var issues = [];
        if (getProgressPct(s) < 50) issues.push('<span class="pill pill-warning">Low progress</span>');
        var exam = getExamPct(s);
        if (exam !== null && exam < 50) issues.push('<span class="pill pill-danger">Exam below 50%</span>');
        if (s.integrityFlags > 0) issues.push('<span class="pill pill-danger">' + s.integrityFlags + ' integrity flag(s)</span>');
        return '<tr class="alert-row"><td><strong>' + escapeHtml(s.name) + '</strong><br><small style="color:var(--gray);">' + escapeHtml(s.studentNo) + '</small></td><td>' + issues.join(' ') + '</td>' +
          '<td><button class="btn btn-sm btn-primary" onclick="viewStudent(\'' + escapeHtml(s.studentNo || s.email) + '\')">View</button></td></tr>';
      }).join('') +
      '</tbody></table></div>';
  }
  html += '</div>';
  document.getElementById('mainContent').innerHTML = html;
}

/* ---------- FEEDBACK ---------- */
function renderFeedback() {
  var html = '<div class="card"><div class="card-header"><div><div class="card-title">💬 Student Feedback</div><div class="card-subtitle">' + DASH.feedback.length + ' message(s)</div></div><button class="btn btn-sm btn-outline" onclick="loadFeedback()">🔄 Refresh</button></div>';
  if (!DASH.feedback.length) {
    html += '<div class="empty-state"><div class="icon">💬</div><p>No feedback yet. Students can send messages from the student app.</p></div>';
  } else {
    html += DASH.feedback.map(function(f){
      return '<div class="feedback-card"><div class="feedback-meta">' + escapeHtml(f.studentName || 'Anonymous') + ' · ' + (f.timestamp ? new Date(f.timestamp).toLocaleString() : '') + '</div><div class="feedback-body">' + escapeHtml(f.message || '') + '</div></div>';
    }).join('');
  }
  html += '</div>';
  document.getElementById('mainContent').innerHTML = html;
}

async function loadFeedback() {
  try {
    var res = await fetch(BACKEND_URL + '?action=listFeedback');
    var data = await res.json();
    if (data.success && data.records) {
      DASH.feedback = data.records;
      saveLocal();
      renderFeedback();
      toast('✅ Loaded ' + data.records.length + ' messages', 'success');
    }
  } catch (e) { toast('Failed to load feedback', 'error'); }
}

/* ---------- QR SCANNER ---------- */
var qrStream = null, qrAnimationId = null;

function renderQRScanner() {
  document.getElementById('mainContent').innerHTML =
    '<div class="card"><div class="card-header"><div><div class="card-title">📷 QR Code Scanner</div><div class="card-subtitle">Scan a student\'s submission QR to view their record</div></div></div>' +
    '<div class="callout callout-info"><strong>How it works:</strong> Have the student open their app and show the QR code from the "Submit Progress" screen. Point your camera at the code.</div>' +
    '<div class="qr-scanner-container" id="qrContainer">' +
      '<video id="qrVideo" autoplay muted playsinline></video>' +
      '<div class="qr-overlay"><div class="qr-frame"><div class="qr-scan-line"></div></div></div>' +
    '</div>' +
    '<div class="qr-status" id="qrStatus">Click "Start Camera" below to begin scanning</div>' +
    '<div class="flex gap-1 justify-center flex-wrap mt-2">' +
      '<button class="btn btn-primary" id="qrStartBtn" onclick="startQRScan()">📷 Start Camera</button>' +
      '<button class="btn btn-outline" id="qrStopBtn" onclick="stopQRScan()" style="display:none;">⏹ Stop</button>' +
    '</div>' +
    '<div class="callout callout-warning mt-2"><strong>Or enter code manually:</strong> If the camera isn\'t working, ask the student for their submission code (they can see it in their app).</div>' +
    '<div class="form-row"><div class="form-group"><input type="text" id="manualCode" placeholder="e.g., KUB-XXXX-XXXX"></div>' +
    '<div class="form-group"><button class="btn btn-primary" onclick="lookupByCode()">🔍 Lookup</button></div></div>' +
    '</div>';
}

async function startQRScan() {
  var video = document.getElementById('qrVideo');
  var status = document.getElementById('qrStatus');
  try {
    qrStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = qrStream;
    video.setAttribute('playsinline', true);
    video.play();
    document.getElementById('qrStartBtn').style.display = 'none';
    document.getElementById('qrStopBtn').style.display = 'inline-flex';
    status.textContent = 'Scanning…';
    status.className = 'qr-status active';
    scanLoop();
  } catch (err) {
    status.textContent = '❌ Camera access denied. Use manual code entry below.';
    status.className = 'qr-status error';
    console.warn(err);
  }
}

function scanLoop() {
  var video = document.getElementById('qrVideo');
  var canvas = document.createElement('canvas');
  var ctx = canvas.getContext('2d');
  function tick() {
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      var code = window.jsQR ? jsQR(imageData.data, imageData.width, imageData.height) : null;
      if (code && code.data) {
        stopQRScan();
        handleQRResult(code.data);
        return;
      }
    }
    qrAnimationId = requestAnimationFrame(tick);
  }
  tick();
}

function stopQRScan() {
  if (qrStream) { qrStream.getTracks().forEach(function(t){ t.stop(); }); qrStream = null; }
  if (qrAnimationId) { cancelAnimationFrame(qrAnimationId); qrAnimationId = null; }
  var btn1 = document.getElementById('qrStartBtn');
  var btn2 = document.getElementById('qrStopBtn');
  if (btn1) btn1.style.display = 'inline-flex';
  if (btn2) btn2.style.display = 'none';
}

async function handleQRResult(data) {
  var status = document.getElementById('qrStatus');
  status.textContent = '✅ Code detected: ' + data;
  status.className = 'qr-status active';
  var code = data;
  // Try to parse JSON if it's the full payload
  try {
    var parsed = JSON.parse(data);
    if (parsed.code) code = parsed.code;
    else if (parsed.studentNo) { showScannedStudent(parsed); return; }
  } catch (e) {}
  try {
    var res = await fetch(BACKEND_URL + '?action=listByCode&code=' + encodeURIComponent(code));
    var result = await res.json();
    if (result.success) {
      var student = DASH.students.find(function(s){ return s.code === code; });
      if (!student) {
        student = {
          code: code, name: result.record.fullName, studentNo: result.record.studentNo,
          section: result.record.section, group: result.record.group, email: result.record.email,
          schoolYear: result.record.schoolYear, semester: result.record.semester,
          unitsCompleted: result.record.unitsCompleted, unitAvg: result.record.unitAvg,
          examScore: result.record.examScore, examTotal: result.record.examTotal,
          examPercentage: result.record.examPercentage, examPassed: result.record.examPassed,
          integrityFlags: result.record.integrityFlags, timestamp: result.record.timestamp
        };
        var payload = null;
        try { payload = JSON.parse(result.record.dataJson); } catch (e) {}
        if (payload) {
          student.progress = payload.progress;
          student.quizAttempts = payload.quizAttempts;
          student.games = payload.games;
          student.exam = payload.exam;
        }
        DASH.students.push(student);
        saveLocal();
      }
      viewStudent(student.studentNo || student.email);
    } else {
      status.textContent = '❌ ' + (result.error || 'Code not found');
      status.className = 'qr-status error';
    }
  } catch (err) {
    status.textContent = '❌ Network error: ' + err.message;
    status.className = 'qr-status error';
  }
}

function showScannedStudent(data) {
  viewStudent(data.studentNo || data.email);
}

async function lookupByCode() {
  var code = document.getElementById('manualCode').value.trim();
  if (!code) { toast('Enter a code first', 'warning'); return; }
  await handleQRResult(code);
}

/* ---------- RETAKES ---------- */

    '<div class="callout callout-warning"><strong>Use with care:</strong> Retake codes let a student attempt the exam again. Only issue when justified (technical failure, medical emergency).</div>' +
    '<div class="form-row"><div class="form-group"><label>Student No.</label><input type="text" id="retakeNo" placeholder="2024-00123"></div>' +
    '<div class="form-group"><label>Email (optional)</label><input type="email" id="retakeEmail" placeholder="student@tsu.edu.ph"></div></div>' +
    '<button class="btn btn-primary" onclick="issueRetake()">🔑 Issue Retake Code</button>';

    html += '<div class="empty-state mt-2"><div class="icon">🔑</div><p>No retake codes issued yet.</p></div>';
  } else {
    html += '<h3 class="mt-2">Issued Codes</h3><div class="table-wrap"><table><thead><tr><th>Student No.</th><th>Code</th><th>Issued</th><th>Used</th></tr></thead><tbody>' +
      DASH.retakes.map(function(r){
        return '<tr><td>' + escapeHtml(r.studentNo) + '</td><td><code>' + escapeHtml(r.retakeCode) + '</code></td><td><small>' + (r.timestamp ? new Date(r.timestamp).toLocaleString() : '') + '</small></td><td>' + (r.used ? '<span class="pill pill-success">Yes</span>' : '<span class="pill pill-warning">No</span>') + '</td></tr>';
      }).join('') +

}

async function issueRetake() {
  var no = document.getElementById('retakeNo').value.trim();
  var email = document.getElementById('retakeEmail').value.trim();
  if (!no) { toast('Student number is required', 'warning'); return; }
  try {
    var params = new URLSearchParams();
    params.append('action', 'issueRetake');
    params.append('studentNo', no);
    params.append('email', email);
    var res = await fetch(BACKEND_URL + '?' + params.toString());
    var data = await res.json();
    if (data.success) {
      DASH.retakes.push({ studentNo: no, email: email, retakeCode: data.retakeCode, timestamp: new Date().toISOString(), used: false });
      saveLocal();
      renderRetakes();
      showRetakeModal(data.retakeCode, no);
    } else {
      throw new Error(data.error || 'Issue failed');
    }
  } catch (err) {
    toast('❌ ' + err.message, 'error');
  }
}

function showRetakeModal(code, studentNo) {

async function loadRetakes() {
  try {
    var res = await fetch(BACKEND_URL + '?action=listRetakes');

/* ---------- IMPORT ---------- */
function renderImport() {
  document.getElementById('mainContent').innerHTML =
    '<div class="card"><div class="card-header"><div><div class="card-title">📥 Import Student Data</div><div class="card-subtitle">Paste JSON from a student\'s device</div></div></div>' +
    '<div class="callout callout-info"><strong>When to use:</strong> If a student completed work offline and cannot submit via the app, they can export their data and send it to you. Paste it here to add them to the roster.</div>' +
    '<div class="drop-zone" id="dropZone" onclick="document.getElementById(\'importFile\').click()" ondragover="event.preventDefault(); this.classList.add(\'dragover\')" ondragleave="this.classList.remove(\'dragover\')" ondrop="handleDrop(event)">' +
      '<div class="drop-icon">📁</div>' +
      '<div class="drop-title">Drop JSON file here or click to browse</div>' +
      '<div class="drop-hint">Accepts .json files exported from the student app</div>' +
      '<input type="file" id="importFile" accept=".json" style="display:none" onchange="handleFileSelect(event)">' +
    '</div>' +
    '<div class="form-group mt-2"><label>Or paste JSON directly:</label>' +
    '<textarea class="paste-area" id="pasteArea" placeholder=\'{"student": {...}, "progress": {...}, "quizAttempts": {...}, "games": {...}, "exam": {...}}\'></textarea></div>' +
    '<button class="btn btn-primary btn-block" onclick="importPasted()">📥 Import Pasted Data</button>' +
    '<div id="importPreview"></div>' +
    '</div>';
}

function handleDrop(event) {
  event.preventDefault();
  document.getElementById('dropZone').classList.remove('dragover');
  var file = event.dataTransfer.files[0];
  if (file) readImportFile(file);
}
function handleFileSelect(event) {
  var file = event.target.files[0];
  if (file) readImportFile(file);
}
function readImportFile(file) {
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      previewImport(data);
    } catch (err) {
      toast('❌ Invalid JSON file', 'error');
    }
  };
  reader.readAsText(file);
}
function importPasted() {
  var text = document.getElementById('pasteArea').value.trim();
  if (!text) { toast('Paste JSON first', 'warning'); return; }
  try {
    var data = JSON.parse(text);
    previewImport(data);
  } catch (err) {
    toast('❌ Invalid JSON', 'error');
  }
}
function previewImport(data) {
  var student = data.student || data;
  document.getElementById('importPreview').innerHTML =
    '<div class="preview-box"><div class="preview-title">✅ Data Validated</div>' +
    '<p><strong>Name:</strong> ' + escapeHtml(student.fullName || student.name || '—') + '<br>' +
    '<strong>Student No.:</strong> ' + escapeHtml(student.studentNo || '—') + '<br>' +
    '<strong>Section:</strong> ' + escapeHtml(student.section || '—') + '</p>' +
    '<button class="btn btn-success btn-block" onclick="confirmImport()">📥 Add to Roster</button></div>';
  window._importData = data;
}
function confirmImport() {
  var data = window._importData;
  if (!data) return;
  var student = data.student || data;
  var existing = DASH.students.find(function(s){ return s.studentNo === student.studentNo; });
  var record = {
    timestamp: new Date().toISOString(),
    code: 'IMPORT-' + Date.now().toString(36).toUpperCase(),
    name: student.fullName || student.name || 'Unknown',
    studentNo: student.studentNo || '',
    section: student.section || '',
    group: student.group || '',
    email: student.email || '',
    schoolYear: student.schoolYear || '',
    semester: student.semester || '',
    unitsCompleted: '0%',
    progress: data.progress || {},
    quizAttempts: data.quizAttempts || {},
    games: data.games || {},
    exam: data.exam || null,
    integrityFlags: 0
  };
  if (existing) { Object.assign(existing, record); toast('✅ Updated existing student', 'success'); }
  else { DASH.students.push(record); toast('✅ Added to roster', 'success'); }
  saveLocal();
  showView('roster');
}

/* ---------- EXPORT ---------- */
function exportRosterCSV() {
  if (!DASH.students.length) { toast('No students to export', 'warning'); return; }
  var headers = ['Name','Student No.','Section','Group','Email','School Year','Semester','Progress %','Quiz Avg','Exam %','Exam Result','Integrity Flags'];
  var rows = [headers];
  DASH.students.forEach(function(s){
    rows.push([
      s.name, s.studentNo, s.section, s.group, s.email, s.schoolYear, s.semester,
      getProgressPct(s), getQuizAvg(s) || '', getExamPct(s) || '', isExamPassed(s) ? 'PASSED' : (hasExam(s) ? 'FAILED' : 'Not taken'),
      s.integrityFlags || 0
    ]);
  });
  var csv = rows.map(function(r){
    return r.map(function(c){
      var str = String(c == null ? '' : c);
      return /[",\n]/.test(str) ? '"' + str.replace(/"/g, '""') + '"' : str;
    }).join(',');
  }).join('\n');
  var blob = new Blob([csv], { type: 'text/csv' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'renal-roster-' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  toast('✅ CSV exported', 'success');
}
