<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#F9A825" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<title>Gradebook — Renal (KUB) Mastery v3.1</title>
<style>
:root{
  --primary:#F9A825;--primary-dark:#C17900;--primary-light:#FFF8E1;--primary-glow:rgba(249,168,37,.35);
  --secondary:#1A237E;--secondary-light:#E8EAF6;
  --accent:#E53935;--accent-light:#FFEBEE;
  --success:#43A047;--success-light:#E8F5E9;
  --warning:#FB8C00;--warning-light:#FFF3E0;
  --purple:#6A1B9A;--purple-light:#F3E5F5;
  --dark:#1A1D29;--dark-2:#2A2F3D;
  --light:#FAFAF7;--white:#FFFFFF;--gray:#6E7385;--gray-light:#E8E9ED;--border:#D1D3D9;
  --radius:12px;--radius-sm:8px;
  --shadow-sm:0 1px 3px rgba(26,29,41,.06);
  --shadow:0 4px 16px rgba(26,29,41,.08);
  --shadow-lg:0 12px 32px rgba(26,29,41,.12);
  --shadow-amber:0 8px 24px rgba(249,168,37,.25);
  --font-head:'Inter','Montserrat',sans-serif;
  --font-body:'Inter','Open Sans',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-body);background:var(--light);color:var(--dark);line-height:1.5;-webkit-font-smoothing:antialiased;font-size:14px;padding:1.5rem}
h1,h2,h3,h4{font-family:var(--font-head);font-weight:700;line-height:1.25;letter-spacing:-.02em}
h1{font-size:1.6rem;font-weight:800}h2{font-size:1.2rem}h3{font-size:1rem}
p{margin-bottom:.5rem}button{font-family:inherit}input,select{font-family:inherit}
.container{max-width:1600px;margin:0 auto}
.toolbar{background:var(--white);border-radius:var(--radius);padding:1.1rem 1.35rem;box-shadow:var(--shadow-sm);border:1px solid var(--gray-light);margin-bottom:1.25rem;display:flex;flex-wrap:wrap;gap:.75rem;justify-content:space-between;align-items:center}
.toolbar-left{display:flex;align-items:center;gap:.75rem}
.toolbar-left .logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0;box-shadow:var(--shadow-amber)}
.toolbar-left h1{font-size:1.15rem;color:var(--dark);line-height:1.2}
.toolbar-left small{display:block;font-size:.75rem;color:var(--gray);font-weight:400;margin-top:.15rem}
.toolbar-right{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.55rem 1rem;border-radius:var(--radius-sm);border:none;cursor:pointer;font-family:var(--font-head);font-weight:600;font-size:.82rem;transition:all .15s;text-decoration:none;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:var(--white);box-shadow:0 4px 12px rgba(249,168,37,.28)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(249,168,37,.4)}
.btn-secondary{background:var(--secondary);color:var(--white)}
.btn-secondary:hover{background:#0D1550}
.btn-outline{background:var(--white);color:var(--dark);border:1.5px solid var(--gray-light)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary-dark)}
.btn-ghost{background:transparent;color:var(--gray)}
.btn-ghost:hover{background:var(--gray-light);color:var(--dark)}
.btn-success{background:var(--success);color:var(--white)}
.btn-sm{padding:.4rem .75rem;font-size:.78rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.filter-select{padding:.5rem .7rem;border:1.5px solid var(--gray-light);border-radius:var(--radius-sm);font-size:.82rem;font-family:var(--font-head);font-weight:600;background:#fff;cursor:pointer;color:var(--dark)}
.filter-select:focus{outline:none;border-color:var(--primary)}
.info-banner{background:var(--white);border-radius:var(--radius);padding:1.15rem 1.35rem;box-shadow:var(--shadow-sm);border:1px solid var(--gray-light);border-left:5px solid var(--primary);margin-bottom:1.25rem}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.85rem}
.info-grid .info-item{font-size:.85rem}
.info-grid .info-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.6px;color:var(--gray);font-weight:700;margin-bottom:.15rem}
.info-grid .info-value{color:var(--dark);font-weight:600}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.85rem;margin-bottom:1.25rem}
.stat-pill{background:var(--white);border-radius:var(--radius);padding:1rem 1.15rem;border:1px solid var(--gray-light);box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.stat-pill::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--primary)}
.stat-pill.success::before{background:var(--success)}
.stat-pill.warning::before{background:var(--warning)}
.stat-pill.alert::before{background:var(--accent)}
.stat-pill.purple::before{background:var(--purple)}
.stat-pill .stat-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.6px;color:var(--gray);font-weight:700;margin-bottom:.3rem}
.stat-pill .stat-value{font-size:1.6rem;font-weight:800;color:var(--dark);font-family:var(--font-head);line-height:1}
.stat-pill .stat-sub{font-size:.72rem;color:var(--gray);margin-top:.3rem}
.sheet{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:2rem 1.5rem 1.5rem;margin-bottom:1.5rem;overflow-x:auto;border:1px solid var(--gray-light);position:relative}
.sheet-header{text-align:center;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:2px solid var(--primary)}
.sheet-header h1{font-size:1.35rem;color:var(--primary-dark);margin-bottom:.35rem}
.sheet-header h2{font-size:.95rem;color:var(--dark);font-family:var(--font-body);font-weight:600;margin-bottom:.3rem;text-transform:uppercase}
.sheet-header p{margin:.15rem 0;font-size:.82rem;color:var(--gray)}
.sheet-header .version-tag{display:inline-block;background:var(--primary-light);color:var(--primary-dark);padding:.15rem .6rem;border-radius:999px;font-size:.68rem;font-weight:700;margin-top:.35rem;border:1px solid var(--primary)}
table.gradebook{width:100%;border-collapse:collapse;font-size:.78rem}
table.gradebook th,table.gradebook td{border:1px solid var(--border);padding:.5rem .4rem;text-align:center;vertical-align:middle}
table.gradebook thead th{background:var(--secondary);color:var(--white);font-family:var(--font-head);font-weight:600;font-size:.68rem;letter-spacing:.4px;text-transform:uppercase;padding:.6rem .4rem;position:sticky;top:0;z-index:5}
table.gradebook thead th.sub{background:#0D1550;font-size:.65rem}
table.gradebook thead th.exam-header{background:var(--purple)}
table.gradebook thead th.valid-header{background:var(--primary-dark)}
table.gradebook tbody td.name-cell{text-align:left;font-weight:700;white-space:nowrap;min-width:170px;padding-left:.75rem;font-size:.82rem;color:var(--dark)}
table.gradebook tbody td.no-cell{text-align:left;padding-left:.65rem;min-width:95px;font-size:.72rem;color:var(--gray);font-weight:600}
table.gradebook tbody td.group-cell{font-size:.72rem;color:var(--gray);font-weight:600}
table.gradebook tbody tr:nth-child(even){background:#FAFBFC}
table.gradebook tbody tr:hover{background:var(--primary-light)}
table.gradebook td.num{text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
table.gradebook td.final{font-weight:800;font-size:.85rem}
td.score-pass{background:var(--success-light);color:#1B5E20}
td.score-warn{background:var(--warning-light);color:#E65100}
td.score-fail{background:var(--accent-light);color:#B71C1C}
td.score-empty{background:#FAFBFC;color:#B0BEC5;font-weight:400}
td.final-pass{background:#C8E6C9;color:#1B5E20}
td.final-warn{background:#FFE0B2;color:#E65100}
td.final-fail{background:#FFCDD2;color:#B71C1C}
td.exam-pass{background:#C8E6C9;color:#1B5E20;font-weight:800}
td.exam-fail{background:#FFCDD2;color:#B71C1C;font-weight:800}
td.remarks-pass{color:var(--success);font-weight:700}
td.remarks-fail{color:var(--accent);font-weight:700}
td.valid-ok{color:var(--success);font-weight:600;font-size:.75rem}
td.valid-warn{color:var(--accent);font-weight:700;font-size:.72rem;background:#FFF8E1}
.legend{display:flex;flex-wrap:wrap;gap:1.25rem;font-size:.75rem;margin-top:1.25rem;padding-top:1rem;border-top:1px dashed var(--border);color:var(--gray)}
.legend-item{display:flex;align-items:center;gap:.4rem}
.legend-swatch{width:14px;height:14px;border-radius:4px;border:1px solid var(--border)}
.swatch-pass{background:#C8E6C9}.swatch-warn{background:#FFE0B2}.swatch-fail{background:#FFCDD2}.swatch-empty{background:#FAFBFC}.swatch-exam{background:#E1BEE7}
.signature-block{display:grid;grid-template-columns:1fr 1fr;gap:3rem;margin-top:2.5rem;padding-top:1.5rem;border-top:2px solid var(--primary)}
.signature-line{border-top:1px solid var(--dark);padding-top:.4rem;text-align:center;font-size:.82rem;margin-top:3rem}
.signature-line strong{display:block;font-family:var(--font-head);margin-bottom:.15rem}
.signature-line small{color:var(--gray);font-size:.72rem}
.developer-footer{text-align:center;margin-top:2rem;padding:1.25rem;border-top:1px dashed var(--border);font-size:.75rem;color:var(--gray)}
.developer-footer .dev-label{font-size:.65rem;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:.25rem}
.developer-footer .dev-name{font-family:var(--font-head);font-weight:700;font-size:.9rem;color:var(--primary-dark);margin:.35rem 0}
.empty-state{text-align:center;padding:4rem 1.5rem;color:var(--gray)}
.empty-state .icon{font-size:4rem;margin-bottom:1rem;opacity:.4}
.empty-state h2{color:var(--dark);font-size:1.15rem;margin-bottom:.5rem}
.empty-state p{font-size:.88rem;max-width:400px;margin:0 auto 1.5rem}
.loader{display:flex;align-items:center;justify-content:center;padding:4rem;font-size:1rem;color:var(--gray);flex-direction:column;gap:1rem}
.spinner{width:40px;height:40px;border:4px solid var(--gray-light);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--dark);color:var(--white);padding:.85rem 1.25rem;border-radius:10px;box-shadow:var(--shadow-lg);z-index:999;transform:translateY(200%);transition:transform .3s;max-width:380px;font-size:.85rem;font-weight:500;display:flex;align-items:center;gap:.5rem}
.toast.show{transform:translateY(0)}
.toast.success{background:var(--success)}
.toast.error{background:var(--accent)}
.toast.warning{background:var(--warning)}
.modal-overlay{position:fixed;inset:0;background:rgba(26,29,41,.6);display:none;align-items:center;justify-content:center;z-index:1000;padding:1rem;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal{background:var(--white);border-radius:var(--radius);max-width:640px;width:100%;max-height:90vh;overflow-y:auto;padding:0;box-shadow:var(--shadow-lg)}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:1.15rem 1.4rem;border-bottom:1px solid var(--gray-light);position:sticky;top:0;background:var(--white);z-index:3;border-radius:var(--radius) var(--radius) 0 0}
.modal-header h2{font-size:1.05rem;color:var(--dark)}
.modal-close{background:var(--light);border:none;font-size:1.1rem;cursor:pointer;color:var(--gray);line-height:1;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--accent-light);color:var(--accent)}
.modal-body{padding:1.4rem}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-weight:600;margin-bottom:.3rem;font-size:.8rem;font-family:var(--font-head);color:var(--dark-2)}
.form-group input,.form-group select{width:100%;padding:.6rem .85rem;border:1.5px solid var(--gray-light);border-radius:var(--radius-sm);font-size:.9rem}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-glow)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:.85rem}
@media(max-width:480px){.form-row{grid-template-columns:1fr}}
.callout{padding:.85rem 1.1rem;border-radius:var(--radius-sm);margin:.85rem 0;border-left:4px solid;font-size:.85rem}
.callout-info{background:var(--secondary-light);border-color:var(--secondary)}
.callout-success{background:var(--success-light);border-color:var(--success)}
.callout-warning{background:var(--warning-light);border-color:var(--warning)}
.callout-danger{background:var(--accent-light);border-color:var(--accent)}
.callout strong{font-family:var(--font-head);font-weight:700}
.hidden{display:none!important}
.flex{display:flex}.items-center{align-items:center}.gap-1{gap:.5rem}.mt-1{margin-top:.5rem}.mt-2{margin-top:1rem}.text-center{text-align:center}.text-gray{color:var(--gray)}
code{background:var(--light);padding:.15rem .4rem;border-radius:4px;font-family:'Courier New',monospace;font-size:.85em;color:var(--primary-dark);font-weight:600}
@media print{
  @page{size:legal landscape;margin:.5cm}
  body{background:white;padding:0;font-size:9pt}
  .toolbar,.no-print,.info-banner,.stats-row,.legend,.developer-footer{display:none!important}
  .sheet{box-shadow:none;border:none;border-radius:0;padding:0;margin:0;page-break-inside:avoid}
  .sheet-header{margin-bottom:.5rem;padding-bottom:.5rem}
  .sheet-header h1{font-size:11pt}
  .sheet-header h2{font-size:9pt}
  table.gradebook{font-size:7.5pt}
  table.gradebook th,table.gradebook td{padding:.2rem .15rem;border-color:#999}
  table.gradebook thead th{background:#1A237E!important;color:white!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.gradebook thead th.sub{background:#0D1550!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.gradebook thead th.exam-header{background:#6A1B9A!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.gradebook thead th.valid-header{background:#C17900!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  td.score-pass,td.final-pass,td.exam-pass{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  td.score-warn,td.final-warn{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  td.score-fail,td.final-fail,td.exam-fail{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  td.valid-warn{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .signature-block{margin-top:1rem;padding-top:.75rem;page-break-inside:avoid}
  .signature-line{margin-top:1.5rem}
}
@media(max-width:768px){
  body{padding:.75rem}
  .toolbar{flex-direction:column;align-items:stretch}
  .toolbar-left,.toolbar-right{justify-content:center}
  .signature-block{grid-template-columns:1fr;gap:1.5rem}
  .sheet{padding:1rem .75rem}
}
</style>
</head>
<body>

<div class="container" id="app">
  <div class="loader"><div class="spinner"></div><div>Loading gradebook...</div></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Modal</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   RENAL (KUB) MASTERY GRADEBOOK — v3.1.0
   Backend: Live Google Apps Script endpoint
   ============================================================ */
var BACKEND_URL = 'https://script.google.com/macros/s/AKfycbyM9Ysp09afI-UPaTPA-OnIpzJ7h8vSR0XhI2z7mptx_FLcasGxPBXGThLBqqASjj-D/exec';

var SCHOOL_YEARS = ['2025-2026','2026-2027','2027-2028','2028-2029','2029-2030','2030-2031','2031-2032','2032-2033'];
var SEMESTERS = ['1st Semester','2nd Semester'];
var CURRENT_SY = '2025-2026';
var CURRENT_SEM = '1st Semester';

var GB = {
  localKey: 'renalMastery_instructor_v3',
  studentKey: 'renalMastery_v1',
  state: {
    students: [],
    settings: {
      courseName: 'NCM 101B Lab — Renal (KUB) Assessment',
      instructorName: 'JEMUEL C. MARI, MAN, RN, LPT',
      passingScore: 75,
      masteryThreshold: 90,
      examPassingScore: 15,
      unitsCompletedWeight: 20,
      unitQuizWeight: 40,
      gamesWeight: 20,
      capstoneWeight: 20
    },
    filters: { schoolYear: CURRENT_SY, semester: CURRENT_SEM },
    lastSync: null
  }
};

var UNIT_KEYS = ['unit1','unit2','unit3','unit4','unit5','unit6','unit7','unit8'];
var UNIT_NAMES = {
  unit1:'U1 Foundation', unit2:'U2 Subjective', unit3:'U3 Inspection',
  unit4:'U4 Auscultation', unit5:'U5 Palpation', unit6:'U6 Percussion',
  unit7:'U7 Diseases', unit8:'U8 Interventions'
};
var GAME_KEYS = ['blitz','tree','urine','redflag','matrix'];
var GAME_NAMES = {
  blitz:'Blitz', tree:'Tree', urine:'Urine ID', redflag:'Red Flag', matrix:'Matrix'
};

function loadLocal() {
  try {
    var raw = localStorage.getItem(GB.localKey);
    if (raw) {
      var parsed = JSON.parse(raw);
      GB.state.students = parsed.students || [];
      GB.state.settings = Object.assign({}, GB.state.settings, parsed.settings || {});
      if (parsed.filters) GB.state.filters = parsed.filters;
      GB.state.lastSync = parsed.lastSync || null;
    }
  } catch (e) { console.warn('Local load failed', e); }

  if (!GB.state.students.length) {
    try {
      var raw2 = localStorage.getItem(GB.studentKey);
      if (raw2) {
        var data = JSON.parse(raw2);
        var studentObj = data.student || data;
        GB.state.students = [{
          id: 'local-1',
          name: studentObj.fullName || 'Current Student (local)',
          studentNo: studentObj.studentNo || '',
          section: studentObj.section || '',
          group: studentObj.group || '',
          email: studentObj.email || '',
          schoolYear: studentObj.schoolYear || CURRENT_SY,
          semester: studentObj.semester || CURRENT_SEM,
          progress: data.progress || {},
          quizAttempts: data.quizAttempts || {},
          games: data.games || {},
          exam: data.exam || null,
          integrityFlags: data.integrityFlags || 0,
          lastActive: new Date().toISOString(),
          notes: 'Loaded from this device'
        }];
      }
    } catch (e) {}
  }
}

async function fetchAllSubmissions() {
  var res = await fetch(BACKEND_URL + '?action=listAll', { method: 'GET' });
  return await res.json();
}

async function syncFromBackend() {
  showLoading('Syncing from Google Sheets...');
  try {
    var result = await fetchAllSubmissions();
    if (!result.success) throw new Error(result.error || 'Sync failed');
    var added = 0, updated = 0;
    (result.records || []).forEach(function(rec) {
      var payload = null;
      try { payload = JSON.parse(rec.dataJson); } catch (e) {}
      var s = (payload && payload.student) || {
        fullName: rec.fullName, studentNo: rec.studentNo, section: rec.section,
        group: rec.group, email: rec.email,
        schoolYear: rec.schoolYear, semester: rec.semester
      };
      var existing = GB.state.students.find(function(x) {
        var matchNo = s.studentNo && x.studentNo && String(x.studentNo).trim() === String(s.studentNo).trim();
        var matchEmail = s.email && x.email && String(x.email).trim().toLowerCase() === String(s.email).trim().toLowerCase();
        var sameSY = (x.schoolYear || '') === (s.schoolYear || rec.schoolYear || '');
        var sameSem = (x.semester || '') === (s.semester || rec.semester || '');
        return (matchNo || matchEmail) && sameSY && sameSem;
      });
      var studentRecord = {
        id: existing ? existing.id : 'S' + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
        name: s.fullName, studentNo: s.studentNo || '', section: s.section || '',
        group: s.group || '', email: s.email || '',
        schoolYear: s.schoolYear || rec.schoolYear || '',
        semester: s.semester || rec.semester || '',
        enrolled: existing ? existing.enrolled : new Date().toISOString().slice(0,10),
        unitsCompleted: rec.unitsCompleted || '0%',
        unitAvg: rec.unitAvg || '0%',
        examScore: rec.examScore || null,
        examTotal: rec.examTotal || null,
        examPercentage: rec.examPercentage || null,
        examPassed: rec.examPassed || '',
        examTakenAt: rec.timestamp || null,
        integrityFlags: rec.integrityFlags || 0,
        appVersion: rec.appVersion || '3.1',
        lastActive: rec.timestamp,
        submissionCode: rec.code,
        notes: existing ? existing.notes : 'Synced from Sheet',
        progress: (payload && payload.progress) || {},
        quizAttempts: (payload && payload.quizAttempts) || {},
        games: (payload && payload.games) || {},
        exam: (payload && payload.exam) || (existing ? existing.exam : null)
      };
      if (existing) {
        var idx = GB.state.students.findIndex(function(x){return x.id===existing.id;});
        if (idx >= 0) { GB.state.students[idx] = studentRecord; updated++; }
      } else {
        GB.state.students.push(studentRecord);
        added++;
      }
    });
    GB.state.lastSync = new Date().toISOString();
    saveLocal();
    render();
    toast('✅ Sync complete — Added: '+added+', Updated: '+updated, 'success');
  } catch (err) {
    console.error(err);
    showError(err.message);
    toast('Sync failed: ' + err.message, 'error');
  }
}

function saveLocal() { try { localStorage.setItem(GB.localKey, JSON.stringify(GB.state)); } catch(e){} }

function toast(msg, type) {
  type = type || '';
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove('show'); }, 3000);
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c];
  });
}
function todayLong(){ return new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}); }
function downloadFile(content, filename, mime) {

  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;

/* ---------- SCORING HELPERS ---------- */
function getUnitAttemptBest(s, unit) {
  if (s.progress && s.progress[unit] && typeof s.progress[unit].score === 'number') return s.progress[unit].score;
  var attempts = s.quizAttempts && s.quizAttempts[unit];
  if (attempts && attempts.length) return Math.max.apply(null, attempts);
  return null;
}
function getGameBest(s, game) {
  var attempts = s.games && s.games[game];
  if (attempts && attempts.length) return Math.max.apply(null, attempts);
  return null;
}
function getExamScore(s) {
  if (s.exam && s.exam.submitted && typeof s.exam.percentage === 'number') return s.exam.percentage;
  if (s.examPercentage !== null && s.examPercentage !== undefined && s.examPercentage !== '') return parseInt(s.examPercentage,10) || null;
  return null;
}
function getExamRaw(s) {
  if (s.examScore !== null && s.examScore !== undefined && s.examScore !== '') {
    return { score: parseInt(s.examScore,10), total: parseInt(s.examTotal,10) || 30 };
  }
  return null;
}
function getUnitAverage(s) {
  var scores = UNIT_KEYS.map(function(u){return getUnitAttemptBest(s,u);}).filter(function(x){return x!==null;});
  if (!scores.length) return null;
  return Math.round(scores.reduce(function(a,b){return a+b;},0) / scores.length);
}
function getGameAverage(s) {
  var scores = GAME_KEYS.map(function(g){return getGameBest(s,g);}).filter(function(x){return x!==null;});
  if (!scores.length) return null;
  return Math.round(scores.reduce(function(a,b){return a+b;},0) / scores.length);
}
function getCompletionPercent(s) {
  if (typeof s.unitsCompleted === 'string') return parseInt(s.unitsCompleted,10) || 0;
  if (typeof s.unitsCompleted === 'number') return s.unitsCompleted;
  var done = UNIT_KEYS.filter(function(u){ return s.progress && s.progress[u] && s.progress[u].completed; }).length;
  return Math.round((done / UNIT_KEYS.length) * 100);
}
function isExamPassed(s) { return s.examPassed === true || s.examPassed === 'PASSED' || s.examPassed === 'TRUE'; }
function hasExam(s) { return s.examTakenAt || (s.examPercentage !== null && s.examPercentage !== undefined && s.examPercentage !== '') || (s.exam && s.exam.submitted); }

function computeWeightedFinal(s, settings) {
  var unitAvg = getUnitAverage(s);
  var gameAvg = getGameAverage(s);
  var exam = getExamScore(s);
  var completion = getCompletionPercent(s);
  if (unitAvg === null && gameAvg === null && exam === null && completion === 0) return null;
  var w = settings, total = 0, weightSum = 0;
  if (completion !== null) { total += completion * (w.unitsCompletedWeight / 100); weightSum += w.unitsCompletedWeight; }
  if (unitAvg !== null)    { total += unitAvg    * (w.unitQuizWeight / 100);       weightSum += w.unitQuizWeight; }
  if (gameAvg !== null)    { total += gameAvg    * (w.gamesWeight / 100);          weightSum += w.gamesWeight; }
  if (exam !== null)       { total += exam       * (w.capstoneWeight / 100);       weightSum += w.capstoneWeight; }
  if (weightSum === 0) return null;
  return Math.round((total / weightSum) * 100);
}

var TRANSMUTATION = [
  { min:97, max:100, grade:1.00 }, { min:94, max:96, grade:1.25 },
  { min:91, max:93, grade:1.50 },  { min:88, max:90, grade:1.75 },
  { min:85, max:87, grade:2.00 },  { min:82, max:84, grade:2.25 },
  { min:79, max:81, grade:2.50 },  { min:76, max:78, grade:2.75 },
  { min:75, max:75, grade:3.00 },  { min:0,  max:74, grade:5.00 }
];
function transmute(p) {
  if (p === null || p === undefined) return null;
  var row = TRANSMUTATION.find(function(r){ return p >= r.min && p <= r.max; });
  return row ? row.grade : 5.00;
}
function formatGrade(g) { return (g === null || g === undefined) ? '—' : g.toFixed(2); }
function getRemarks(g) {
  if (g === null || g === undefined) return '—';
  if (g === 1.00) return 'Excellent';
  if (g <= 1.50) return 'Very Good';
  if (g <= 2.00) return 'Good';
  if (g <= 2.50) return 'Satisfactory';
  if (g <= 3.00) return 'Passed';
  return 'Failed';
}
function getRemarksClass(g){ return (g===null||g===undefined)?'':(g<=3.00?'remarks-pass':'remarks-fail'); }
function scoreClass(val, passThreshold) {
  passThreshold = passThreshold || 90;
  if (val === null || val === undefined) return 'score-empty';
  if (val >= passThreshold) return 'score-pass';
  if (val >= 75) return 'score-warn';
  return 'score-fail';
}
function finalGradeClass(g) {
  if (g === null || g === undefined) return '';
  if (g <= 2.00) return 'final-pass';
  if (g <= 3.00) return 'final-warn';
  return 'final-fail';
}
function cell(val){ return (val === null || val === undefined) ? '<span style="color:#B0BEC5;">—</span>' : val; }

function filterStudents(students, f) {
  return students.filter(function(s){
    if (f.schoolYear && (s.schoolYear || '') !== f.schoolYear) return false;
    if (f.semester && (s.semester || '') !== f.semester) return false;
    return true;
  });
}
function onFilterChange() {
  GB.state.filters.schoolYear = document.getElementById('filterSY').value;
  GB.state.filters.semester = document.getElementById('filterSem').value;
  saveLocal(); render();
}
function validateStudent(s) {
  var issues = [];
  if (!s.name || s.name.length < 3) issues.push('name');
  if (!s.studentNo) issues.push('student no.');
  if (!s.section) issues.push('section');
  if (!s.email || s.email.indexOf('@') < 0) issues.push('email');
  if (!s.schoolYear) issues.push('SY');
  if (!s.semester) issues.push('sem');
  return issues;
}

function renderStudentRow(s) {
  var w = GB.state.settings;
  var unitScores = UNIT_KEYS.map(function(u){return getUnitAttemptBest(s,u);});
  var gameScores = GAME_KEYS.map(function(g){return getGameBest(s,g);});
  var unitAvg = getUnitAverage(s);
  var gameAvg = getGameAverage(s);
  var examPct = getExamScore(s);
  var examRaw = getExamRaw(s);
  var examTaken = hasExam(s);
  var examPass = isExamPassed(s);
  var completion = getCompletionPercent(s);
  var rawFinal = computeWeightedFinal(s, w);
  var transmuted = transmute(rawFinal);
  var remarks = getRemarks(transmuted);
  var issues = validateStudent(s);

  var html = '<tr' + (issues.length ? ' style="background:#FFF8E1;"' : '') + '>';
  html += '<td class="name-cell">' + escapeHtml(s.name) + '</td>';
  html += '<td class="no-cell">' + escapeHtml(s.studentNo || '—') + '</td>';
  html += '<td class="group-cell">' + escapeHtml(s.section || '—') + '</td>';
  html += '<td class="group-cell">' + escapeHtml(s.group || '—') + '</td>';
  html += '<td class="group-cell">' + escapeHtml(s.schoolYear || '—') + '</td>';
  html += '<td class="group-cell">' + escapeHtml(s.semester || '—') + '</td>';
  unitScores.forEach(function(v){ html += '<td class="num '+scoreClass(v,w.masteryThreshold)+'">'+cell(v)+'</td>'; });
  html += '<td class="num final '+scoreClass(unitAvg,w.masteryThreshold)+'">'+cell(unitAvg)+'</td>';
  gameScores.forEach(function(v){ html += '<td class="num '+scoreClass(v,90)+'">'+cell(v)+'</td>'; });
  html += '<td class="num final '+scoreClass(gameAvg,90)+'">'+cell(gameAvg)+'</td>';
  if (examTaken) {
    var examScoreText = examRaw ? (examRaw.score+'/'+examRaw.total) : (examPct+'%');
    html += '<td class="num '+scoreClass(examPct,90)+'">'+examScoreText+'<br><small>'+examPct+'%</small></td>';
    html += '<td class="num '+(examPass?'exam-pass':'exam-fail')+'">'+(examPass?'✅ PASS':'❌ FAIL')+'</td>';
  } else {
    html += '<td class="num score-empty">—</td><td class="num score-empty">Not taken</td>';
  }
  html += '<td class="num">' + completion + '%</td>';
  html += '<td class="num final">' + (rawFinal !== null ? rawFinal : '—') + '</td>';
  html += '<td class="num final '+finalGradeClass(transmuted)+'">' + formatGrade(transmuted) + '</td>';
  html += '<td class="remarks '+getRemarksClass(transmuted)+'">' + remarks + '</td>';
  html += '<td class="'+(issues.length?'valid-warn':'valid-ok')+'">' +
    (issues.length ? '⚠️ Missing: ' + issues.join(', ') : '✅ Complete') + '</td>';
  html += '</tr>';
  return html;
}

function renderClassAverageRow(students) {
  var w = GB.state.settings, n = students.length;
  if (!n) return '';
  var avg = function(vals) {
    var nums = vals.filter(function(v){return v!==null && v!==undefined;});
    if (!nums.length) return null;
    return Math.round(nums.reduce(function(a,b){return a+b;},0) / nums.length);
  };
  var unitAvgs = UNIT_KEYS.map(function(u){return avg(students.map(function(s){return getUnitAttemptBest(s,u);}));});
  var gameAvgs = GAME_KEYS.map(function(g){return avg(students.map(function(s){return getGameBest(s,g);}));});
  var unitAvgOfAvgs = avg(unitAvgs);
  var gameAvgOfAvgs = avg(gameAvgs);
  var examAvg = avg(students.map(function(s){return getExamScore(s);}));
  var completionAvg = avg(students.map(function(s){return getCompletionPercent(s);}));
  var rawAvg = avg(students.map(function(s){return computeWeightedFinal(s,w);}));
  var transmutedAvg = avg(students.map(function(s){return transmute(computeWeightedFinal(s,w));}));
  var examPassCount = students.filter(function(s){return isExamPassed(s);}).length;
  var examTakenCount = students.filter(function(s){return hasExam(s);}).length;

  var html = '<tr style="background:#FFF8E1;font-weight:800;border-top:2px solid var(--primary);">';
  html += '<td class="name-cell" colspan="6" style="text-align:right;padding-right:.75rem;font-size:.8rem;">CLASS AVERAGE →</td>';
  unitAvgs.forEach(function(v){ html += '<td class="num">'+(v!==null?v:'—')+'</td>'; });
  html += '<td class="num final">'+(unitAvgOfAvgs!==null?unitAvgOfAvgs:'—')+'</td>';
  gameAvgs.forEach(function(v){ html += '<td class="num">'+(v!==null?v:'—')+'</td>'; });
  html += '<td class="num final">'+(gameAvgOfAvgs!==null?gameAvgOfAvgs:'—')+'</td>';
  html += '<td class="num">'+(examAvg!==null?examAvg+'%':'—')+'<br><small>'+examPassCount+'/'+examTakenCount+'</small></td>';
  html += '<td class="num">'+(examTakenCount?Math.round((examPassCount/examTakenCount)*100)+'%':'—')+'</td>';
  html += '<td class="num">'+(completionAvg!==null?completionAvg+'%':'—')+'</td>';
  html += '<td class="num final">'+(rawAvg!==null?rawAvg:'—')+'</td>';
  html += '<td class="num final">'+(transmutedAvg!==null?formatGrade(transmutedAvg):'—')+'</td>';
  html += '<td class="remarks"></td><td></td>';
  html += '</tr>';
  return html;
}

function openNormalizeModal() {
  openModal('🧹 Normalize Data',
    '<div class="callout callout-info"><strong>What this does:</strong> Trims spaces, fixes capitalization, and standardizes section/group names across all student records in view.</div>' +
    '<div class="form-group"><label>Name Style</label><select id="normNameStyle"><option value="title">Title Case (Juan Dela Cruz)</option><option value="upper">UPPERCASE</option><option value="lower">lowercase</option></select></div>' +
    '<div class="form-group"><label>Section Style</label><select id="normSectionStyle"><option value="upper">UPPERCASE</option><option value="title">Title Case</option></select></div>' +
    '<button class="btn btn-primary btn-block mt-2" onclick="applyNormalize()">Apply Normalization</button>'
  );
}
function applyNormalize() {
  var nameStyle = document.getElementById('normNameStyle').value;
  var sectionStyle = document.getElementById('normSectionStyle').value;
  var students = filterStudents(GB.state.students, GB.state.filters);
  students.forEach(function(s) {
    if (s.name) {
      var trimmed = s.name.trim().replace(/\s+/g,' ');
      if (nameStyle === 'title') trimmed = trimmed.replace(/\w\S*/g, function(t){return t.charAt(0).toUpperCase()+t.substr(1).toLowerCase();});
      if (nameStyle === 'upper') trimmed = trimmed.toUpperCase();
      if (nameStyle === 'lower') trimmed = trimmed.toLowerCase();
      s.name = trimmed;
    }
    if (s.section) {
      var sec = s.section.trim().replace(/\s+/g,' ');
      if (sectionStyle === 'upper') sec = sec.toUpperCase();
      if (sectionStyle === 'title') sec = sec.replace(/\w\S*/g, function(t){return t.charAt(0).toUpperCase()+t.substr(1).toLowerCase();});
      s.section = sec;
    }
    if (s.group) s.group = s.group.trim().replace(/\s+/g,' ');
  });
  saveLocal(); closeModal(); render();
  toast('✅ Normalization applied to ' + students.length + ' students', 'success');
}

function openWeightsModal() {
  var w = GB.state.settings;
  openModal('⚖️ Grading Weights',
    '<div class="callout callout-warning"><strong>Warning:</strong> Changing weights immediately recalculates all grades. Make sure this reflects your department policy.</div>' +
    '<div class="form-row">' +
      '<div class="form-group"><label>Units Completed (%)</label><input type="number" id="wCompletion" min="0" max="100" value="'+w.unitsCompletedWeight+'"></div>' +
      '<div class="form-group"><label>Unit Quizzes (%)</label><input type="number" id="wUnit" min="0" max="100" value="'+w.unitQuizWeight+'"></div>' +
    '</div>' +
    '<div class="form-row">' +
      '<div class="form-group"><label>Games (%)</label><input type="number" id="wGames" min="0" max="100" value="'+w.gamesWeight+'"></div>' +
      '<div class="form-group"><label>Capstone Exam (%)</label><input type="number" id="wExam" min="0" max="100" value="'+w.capstoneWeight+'"></div>' +
    '</div>' +
    '<div class="callout callout-info">Current total: <strong id="weightTotal">100</strong>%</div>' +
    '<button class="btn btn-primary btn-block mt-2" onclick="applyWeights()">Save Weights</button>'
  );
  ['wCompletion','wUnit','wGames','wExam'].forEach(function(id){
    document.getElementById(id).addEventListener('input', function(){
      var t = ['wCompletion','wUnit','wGames','wExam'].reduce(function(a,id){return a + (parseInt(document.getElementById(id).value)||0);},0);
      document.getElementById('weightTotal').textContent = t;
    });
  });
}
function applyWeights() {
  var t = ['wCompletion','wUnit','wGames','wExam'].reduce(function(a,id){return a + (parseInt(document.getElementById(id).value)||0);},0);
  if (t !== 100) { toast('❌ Weights must total 100% (currently '+t+'%)', 'error'); return; }
  GB.state.settings.unitsCompletedWeight = parseInt(document.getElementById('wCompletion').value)||0;
  GB.state.settings.unitQuizWeight = parseInt(document.getElementById('wUnit').value)||0;
  GB.state.settings.gamesWeight = parseInt(document.getElementById('wGames').value)||0;
  GB.state.settings.capstoneWeight = parseInt(document.getElementById('wExam').value)||0;
  saveLocal(); closeModal(); render();
  toast('✅ Weights updated and grades recalculated', 'success');
}

/* ---------- EXPORT ---------- */
function exportCSV() {
  var students = filterStudents(GB.state.students, GB.state.filters);
  if (!students.length) { toast('No data to export', 'warning'); return; }
  var w = GB.state.settings;
  var headers = ['Student Name','Student No.','Section','Group','School Year','Semester']
    .concat(UNIT_KEYS.map(function(u){return UNIT_NAMES[u];}))
    .concat(['Unit Avg'])
    .concat(GAME_KEYS.map(function(g){return GAME_NAMES[g];}))
    .concat(['Games Avg','Exam Score','Exam Result','Units Completed %','Raw %','Final Grade','Remarks','Validation']);
  var rows = [headers];
  students.forEach(function(s){
    var unitScores = UNIT_KEYS.map(function(u){return getUnitAttemptBest(s,u) ?? '';});
    var gameScores = GAME_KEYS.map(function(g){return getGameBest(s,g) ?? '';});
    var rawFinal = computeWeightedFinal(s,w);
    var trans = transmute(rawFinal);
    var issues = validateStudent(s);
    rows.push([
      s.name, s.studentNo, s.section, s.group, s.schoolYear, s.semester,
      ...unitScores, getUnitAverage(s) ?? '',
      ...gameScores, getGameAverage(s) ?? '',
      getExamScore(s) ?? '', isExamPassed(s) ? 'PASS' : (hasExam(s) ? 'FAIL' : 'Not taken'),
      getCompletionPercent(s)+'%', rawFinal ?? '', formatGrade(trans), getRemarks(trans),
      issues.length ? 'Missing: '+issues.join(', ') : 'Complete'
    ]);
  });
  var csv = rows.map(function(r){
    return r.map(function(cell){
      var str = String(cell == null ? '' : cell);
      return /[",\n]/.test(str) ? '"'+str.replace(/"/g,'""')+'"' : str;
    }).join(',');
  }).join('\n');
  downloadFile(csv, 'renal-gradebook-'+new Date().toISOString().slice(0,10)+'.csv', 'text/csv');
  toast('✅ CSV exported', 'success');
}

/* ---------- INIT ---------- */
function init() {
  loadLocal();
  render();
}
init();
</script>
