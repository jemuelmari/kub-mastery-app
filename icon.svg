<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D7377"/>
      <stop offset="100%" stop-color="#1E88E5"/>
    </linearGradient>
    <linearGradient id="kidneyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2F1"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Left Kidney -->
  <path d="M 155 130
           C 110 130, 85 195, 95 265
           C 105 335, 145 385, 185 385
           C 205 385, 218 360, 218 325
           L 218 195
           C 218 155, 190 130, 155 130 Z"
        fill="url(#kidneyGrad)"
        stroke="#0B5C5F"
        stroke-width="6"
        stroke-linejoin="round"/>

  <!-- Right Kidney -->
  <path d="M 357 130
           C 402 130, 427 195, 417 265
           C 407 335, 367 385, 327 385
           C 307 385, 294 360, 294 325
           L 294 195
           C 294 155, 322 130, 357 130 Z"
        fill="url(#kidneyGrad)"
        stroke="#0B5C5F"
        stroke-width="6"
        stroke-linejoin="round"/>

  <!-- Left Ureter -->
  <path d="M 185 385 Q 205 430, 235 468"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="9"
        stroke-linecap="round"/>

  <!-- Right Ureter -->
  <path d="M 327 385 Q 307 430, 277 468"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="9"
        stroke-linecap="round"/>

  <!-- Bladder -->
  <ellipse cx="256" cy="478" rx="66" ry="30"
           fill="url(#kidneyGrad)"
           stroke="#0B5C5F"
           stroke-width="6"/>

  <!-- Medical Cross -->
  <rect x="242" y="220" width="28" height="72" rx="4" fill="#E53935"/>
  <rect x="220" y="242" width="72" height="28" rx="4" fill="#E53935"/>
</svg>
